# ==============================================================================
# ABM4bio NIH3T3 Control Calibration Configuration
# Biological case: non-tumoral NIH3T3 spheroids, no CAPP, no GRNs, 2D
# ==============================================================================

# --- Paths -------------------------------------------------------------------
abm4bio_executable: "../../../build/ABM4bio"
abm4bio_dir: "../../.."
excel_file: "data/NIH3T3_control_condition.xlsx"
results_dir: "results/optuna_runs"
best_runs_dir: "results/best_runs"
plots_dir: "results/plots"

# --- Experimental metadata ---------------------------------------------------
pixel_scale_um_per_px: 1.21079857960497
experimental_time_points_h: [0, 12, 24, 36, 48]

# --- Conditions to calibrate -------------------------------------------------
conditions:
  - name: ISO10
    label: "ISO 10% CTRL"
    template_csv: "configs/input_NIH3T3_ISO10_template.csv"
    simulation_title: "NIH3T3_ISO10"
    gluc_boundary_value: 1.0          # normalised Dirichlet BC (uniform glucose)
    gluc_gradient: false
  - name: DeltaC
    label: "DeltaC Gradient"
    template_csv: "configs/input_NIH3T3_DeltaC_template.csv"
    simulation_title: "NIH3T3_DeltaC"
    gluc_boundary_value: 1.0          # gradient configured in template
    gluc_gradient: true

# --- Simulation domain -------------------------------------------------------
domain_min_um: -600.0
domain_max_um:  600.0
domain_is_2D: true
time_step_h: 0.1
simulation_duration_h: 48.0          # → number_of_time_steps = 480
statistics_interval: 10
visualization_interval: 120          # save VTK every 12 h

# --- Cell biology constants (fixed, not calibrated) -------------------------
cell_diameter_min_um: 15.0           # NIH3T3 min diameter
cell_diameter_max_um: 18.0           # NIH3T3 max (nominal ~18 µm)
cell_divide_diameter_cutoff_um: 17.0
cell_divide_probability: 0.40
cell_grow_probability: 0.60
initial_necrotic_cells: 80           # paper-informed prior; trial params may override
initial_necrotic_max_fraction: 0.35  # cap seeded necrotic pool to preserve viable starter cells
initial_necrotic_min_normoxic_cells: 30

# Literature-guided anchors (replace with exact values from your curated papers)
paper_parameter_anchors:
  gluc_diffusion_coefficient_um2_h: 6.0
  baseline_cell_cycle_time_h: 18.0
  notes: "Anchors kept conservative until full-text parameter table is curated."

# Initial conditions derived from experimental t=0 shell area
# run_abm4bio.py will compute n0 and sphere_radius from the data
# These are overrides/fallbacks if data cannot be loaded:
fallback_initial_n_cells: 200
fallback_initial_sphere_radius_um: 80.0

# --- Calibration targets -----------------------------------------------------
calibration_targets:
  - shell_area_um2
  - core_area_um2
  - shell_A_over_A0
  - core_A_over_A0
  - viable_rim_um

# Weights for objective function (one per target, same order)
target_weights:
  shell_A_over_A0: 1.5
  core_A_over_A0:  1.0
  viable_rim_um:   1.0
  shell_area_um2:  2.0
  core_area_um2:   2.0

# Objective hardening
use_sem_normalization: true
sem_floor_fraction: 0.05
late_time_hard_constraints:
  enabled: true
  time_points_h: [24, 36, 48]
  thresholds:
    shell_area_um2: 0.20
    core_area_um2: 0.20
    shell_A_over_A0: 0.15
    core_A_over_A0: 0.15
    viable_rim_um: 0.20
  penalty_scale: 4.0

# Time-point weights (later time points get higher weight)
time_weights:
  0:  0.5
  12: 1.0
  24: 1.5
  36: 1.5
  48: 2.0

# --- Excel sheet parsing configuration --------------------------------------
excel_sheet_average: "Average"

# Row indices (0-based, no header) for each condition in the Average sheet.
# Verified against workbook: rows 4-8 = ISO10, rows 12-16 = DeltaC.
excel_iso10_rows:   [4, 8]
excel_deltac_rows:  [12, 16]

# Column indices (0-based) in the Average sheet.
# Layout:  col0=t_h  col1=shell_px2  col2=shell_um2  col3=shell_A/A0  col4=shell_SEM
#          col5=NaN  col6=t_h(core)  col7=core_px2   col8=core_um2   col9=core_A/A0  col10=core_SEM
excel_col_time_h:          0
excel_col_shell_area_px2:  1
excel_col_shell_area_um2:  2
excel_col_shell_A_over_A0: 3
excel_col_shell_SEM:       4
excel_col_core_area_px2:   7
excel_col_core_area_um2:   8
excel_col_core_A_over_A0:  9
excel_col_core_SEM:        10

# --- Optuna optimisation settings -------------------------------------------
n_trials: 200
n_jobs: 1                            # parallel jobs (set >1 only with a DB storage)
study_name: "NIH3T3_ctrl_calib"
sampler: "TPESampler"
pruner: "MedianPruner"
optuna_db: null                      # e.g. "sqlite:///results/optuna_runs/study.db"
auto_update_template_from_best: true

# --- Multi-seed validation ---------------------------------------------------
n_seeds_validation: 3
validation_seeds: [1234, 5678, 9012]
calibration_seeds: [1234, 5678, 9012]   # used inside each trial objective

# --- Miscellaneous ----------------------------------------------------------
omp_num_threads: 4
verbose: true
