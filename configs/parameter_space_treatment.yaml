# Treatment calibration parameter space (mechanism 12 CAP / RONS / damage).
# Requires frozen control parameters from a prior control Optuna study.
load_frozen_control_params: true

parameters:
  CAP/RONS/source_strength:
    type: float
    low: 1.0e-4
    high: 1.0e2
    scale: log

  cancer_cell/RONS/uptake_vmax:
    type: float
    low: 1.0e-5
    high: 1.0
    scale: log

  cancer_cell/RONS/uptake_km:
    type: float
    low: 1.0e-5
    high: 10.0
    scale: log

  cancer_cell/damage/accumulation_rate:
    type: float
    low: 1.0e-5
    high: 1.0
    scale: log

  cancer_cell/damage/repair_rate:
    type: float
    low: 1.0e-6
    high: 0.5
    scale: log

  cancer_cell/damage/apoptosis_threshold:
    type: float
    low: 0.05
    high: 5.0
    scale: log

  cancer_cell/checkpoint/arrest_threshold:
    type: float
    low: 0.01
    high: 3.0
    scale: log
